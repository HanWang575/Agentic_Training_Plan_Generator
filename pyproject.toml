[project]
name = "personal-coach-ai-agent"
version = "0.1.0"
description = "Local-first personal trainer AI agent with an evidence-based Q&A block."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "chromadb>=0.5.0",
    "ebooklib>=0.18",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "langgraph>=0.2.0",
    "langchain-text-splitters>=1.1.2",
    "mcp>=1.0.0",
    "openai>=1.50.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pymupdf>=1.24.0",
    "python-multipart>=0.0.9",
    "sqlmodel>=0.0.22",
    "streamlit>=1.38.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]
marker = [
    "marker-pdf>=1.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["RAG_corpus*", "docs*", "tests*"]
